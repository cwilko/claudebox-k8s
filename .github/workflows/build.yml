name: Build and push

on:
  push:
    branches: [main]
  schedule:
    # Rebuild weekly too, not just on our own changes — we FROM psyb0t/claudebox:latest,
    # which moves on its own, and we want our one patched file layered on top of
    # whatever that currently is, not a stale pull from whenever we last touched this repo.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: wilkobets/claudebox-k8s:latest
